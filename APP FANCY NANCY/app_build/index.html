                            </div>

                            <div className="flex items-center justify-between text-xs font-semibold">
                              <span className="text-slate-500">Estimasi Thrift:</span>
                              <span className="font-serif text-base font-bold text-pink-600">{formatIDR(cost)}</span>
                            </div>
                          </div>
                        </div>

                        <div className="p-5 pt-0">
                          <button onClick={() => handleApplyLookbook(look)} className="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-rose-500 via-pink-500 to-purple-600 text-white font-bold text-xs shadow-md hover:scale-[1.02] transition-all flex items-center justify-center gap-1.5">
                            <span>Gunakan di Outfit Builder</span> ➔
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 3: THRIFT CHEATSHEET & TIPS */}
            {activeTab === 'cheatsheet' && (
              <div className="space-y-8 max-w-5xl mx-auto">
                <div className="text-center max-w-2xl mx-auto">
                  <div className="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold mb-3 border border-amber-200">
                    🧭 Thrift Hunting Guide & Keyword Engine
                  </div>
                  <h2 className="font-serif text-3xl sm:text-4xl font-black text-slate-900 tracking-tight">
                    Panduan Berburu Thrift <span className="text-pink-500 italic">Fancy Nancy</span>
                  </h2>
                  <p className="mt-2 text-slate-600 text-sm sm:text-base">
                    Kamus kata kunci pencarian, lokasi pasar loak terbaik, dan tips higienis mencuci pakaian vintage agar siap tampil memukau!
                  </p>
                </div>

                {/* Spot Flea Market */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  <div className="bg-white p-5 rounded-3xl border border-rose-200/80 shadow-sm">
                    <span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-rose-100 text-pink-600 inline-block mb-3">Surga Vintage Nusantara</span>
                    <h3 className="font-serif font-bold text-lg text-slate-900">📍 Pasar Senen (Blok III, Jakarta)</h3>
                    <p className="text-xs text-slate-600 mt-2 leading-relaxed">
                      Pusat karung thrift impor terbesar. Kunjungi lantai 3 untuk berburu blus renda brokat, mantel bulu, dan tas manik pesta.
                    </p>
                    <div className="mt-4 pt-3 border-t border-rose-100 text-[11px] text-amber-700 bg-amber-50/70 p-2.5 rounded-xl">
                      <strong>💡 Pro-Tip:</strong> Datang pagi hari (jam 09.00 - 11.00) saat bal baru dibuka.
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-3xl border border-rose-200/80 shadow-sm">
                    <span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-purple-100 text-purple-600 inline-block mb-3">Gudang Rajut & Rok</span>
                    <h3 className="font-serif font-bold text-lg text-slate-900">📍 Pasar Gedebage (Bandung)</h3>
                    <p className="text-xs text-slate-600 mt-2 leading-relaxed">
                      Banyak ragam rok plisket mekar, cardigan rajut pastel bordir, serta jaket velvet dengan harga mulai Rp 15.000.
                    </p>
                    <div className="mt-4 pt-3 border-t border-rose-100 text-[11px] text-amber-700 bg-amber-50/70 p-2.5 rounded-xl">
                      <strong>💡 Pro-Tip:</strong> Siapkan masker dan tawar-menawar dengan ramah.
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-3xl border border-rose-200/80 shadow-sm">
                    <span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 inline-block mb-3">Thrifting Digital 24 Jam</span>
                    <h3 className="font-serif font-bold text-lg text-slate-900">📍 Carousell & Shopee Live</h3>
                    <p className="text-xs text-slate-600 mt-2 leading-relaxed">
                      Sangat praktis untuk mencari kata kunci spesifik seperti "tapestry corset" atau "fascinator hat" dari seller terkurasi.
                    </p>
                    <div className="mt-4 pt-3 border-t border-rose-100 text-[11px] text-amber-700 bg-amber-50/70 p-2.5 rounded-xl">
                      <strong>💡 Pro-Tip:</strong> Gunakan filter "Kondisi: Bekas" dan minta video resleting & ketiak.
                    </div>
                  </div>
                </div>

                {/* Hygiene Checklist */}
                <div className="bg-gradient-to-br from-rose-50 via-purple-50 to-pink-50 rounded-3xl p-6 sm:p-8 border border-rose-200 space-y-4">
                  <h3 className="font-serif text-xl sm:text-2xl font-bold text-slate-900">Protokol Higienis & Perawatan Baju Thrift</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                    <div className="bg-white/80 p-4 rounded-2xl border border-rose-100">
                      <h4 className="font-bold text-rose-600 text-sm mb-1">1. Rendam Antiseptik / Cuka</h4>
                      <p className="text-slate-600">Rendam baju thrift 30 menit dengan air hangat dicampur 3 sendok cuka putih untuk membunuh kuman & tungau.</p>
                    </div>
                    <div className="bg-white/80 p-4 rounded-2xl border border-rose-100">
                      <h4 className="font-bold text-purple-600 text-sm mb-1">2. Perawatan Renda & Tulle</h4>
                      <p className="text-slate-600">Jangan pakai mesin cuci! Cukup kucek lembut dengan detergen cair lembut/sampo bayi dan keringkan di tempat teduh.</p>
                    </div>
                    <div className="bg-white/80 p-4 rounded-2xl border border-rose-100">
                      <h4 className="font-bold text-amber-600 text-sm mb-1">3. Uap Steamer (Bukan Setrika)</h4>
                      <p className="text-slate-600">Gunakan steamer uap agar lipatan plisket metalik dan bahan velvet tidak gosong atau gepeng.</p>
                    </div>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* ITEM SELECTOR MODAL */}
          {selectedCategoryModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col border border-rose-200 overflow-hidden">
                <div className="p-6 bg-gradient-to-r from-rose-50 via-pink-50 to-amber-50/50 border-b border-rose-100 flex items-center justify-between">
                  <div>
                    <h3 className="font-serif text-xl sm:text-2xl font-bold text-slate-900">Pilih: {selectedCategoryModal.label}</h3>
                    <p className="text-xs text-slate-500 mt-0.5">{selectedCategoryModal.desc}</p>
                  </div>
                  <button onClick={() => setSelectedCategoryModal(null)} className="p-2 rounded-full hover:bg-white text-slate-400 hover:text-slate-700 text-xl font-bold">✕</button>
                </div>

                <div className="p-4 sm:p-6 overflow-y-auto space-y-4 flex-1">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {THRIFT_ITEMS.filter((i) => i.category === selectedCategoryModal.id).map((item) => {
                      const isSelected = currentOutfit[selectedCategoryModal.id]?.id === item.id;
                      return (
                        <div key={item.id} onClick={() => { setCurrentOutfit({ ...currentOutfit, [selectedCategoryModal.id]: item }); setSelectedCategoryModal(null); }} className={`rounded-2xl p-3 border-2 cursor-pointer transition-all ${isSelected ? 'border-pink-500 bg-rose-50/50 shadow-fancy' : 'border-rose-100 hover:border-rose-300 bg-white'}`}>
                          <div className="relative h-44 rounded-xl overflow-hidden mb-3 bg-slate-100">
                            <img src={item.image} alt={item.name} className="w-full h-full object-cover" />
                            <div className="absolute top-2 left-2 px-2 py-0.5 rounded-full bg-black/60 text-[11px] font-semibold text-white">{item.aesthetic}</div>
                            {isSelected && <div className="absolute top-2 right-2 w-7 h-7 rounded-full bg-pink-500 text-white flex items-center justify-center font-bold">✓</div>}
                          </div>
                          <h4 className="font-serif font-bold text-slate-900 text-sm leading-snug">{item.name}</h4>
                          <p className="text-xs font-bold text-pink-600 mt-1">Est. Thrift: {item.priceRange} ({formatIDR(item.price)})</p>
                          <p className="text-[11px] italic text-rose-500 mt-1 font-fancy text-base">"{item.fancyNancyFact}"</p>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="p-4 bg-slate-50 border-t border-rose-100 text-right">
                  <button onClick={() => setSelectedCategoryModal(null)} className="px-5 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-200 text-slate-700 hover:bg-slate-100">Tutup</button>
                </div>
              </div>
            </div>
          )}

          {/* VAULT MODAL */}
          {isVaultOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl shadow-2xl max-w-3xl w-full max-h-[90vh] flex flex-col border border-rose-200 overflow-hidden">
                <div className="p-6 bg-gradient-to-r from-rose-50 via-pink-50 to-purple-50 border-b border-rose-100 flex items-center justify-between">
                  <div>
                    <h3 className="font-serif text-xl sm:text-2xl font-bold text-slate-900">💖 My Fancy Thrift Vault</h3>
                    <p className="text-xs text-rose-500 font-medium">{savedOutfits.length} Outfit Tersimpan</p>
                  </div>
                  <button onClick={() => setIsVaultOpen(false)} className="p-2 rounded-full hover:bg-white text-slate-400 hover:text-slate-700 text-xl font-bold">✕</button>
                </div>

                <div className="p-6 overflow-y-auto space-y-4 flex-1">
                  {savedOutfits.length === 0 ? (
                    <div className="text-center py-16 text-slate-400 space-y-2">
                      <p className="text-4xl">🎀</p>
                      <h4 className="font-serif font-bold text-lg text-slate-700">Belum Ada Outfit Tersimpan</h4>
                      <p className="text-xs text-slate-500">Klik "Simpan ke Vault" di builder untuk menyimpan padu-padan favoritmu!</p>
                    </div>
                  ) : (
                    savedOutfits.map((s) => (
                      <div key={s.id} className="p-4 rounded-2xl border border-rose-100 bg-rose-50/20 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                          <div className="flex -space-x-3 overflow-hidden">
                            {[s.outfit.head, s.outfit.upperBody, s.outfit.lowerBody, s.outfit.footwear].filter(Boolean).map((it, i) => (
                              <img key={i} src={it.image} alt={it.name} className="inline-block h-12 w-12 rounded-full ring-2 ring-white object-cover shadow-sm" />
                            ))}
                          </div>
                          <div>
                            <span className="text-[11px] text-slate-400">{s.date}</span>
                            <h4 className="font-serif font-bold text-slate-900 text-sm">{s.title}</h4>
                            <p className="text-xs font-bold text-pink-600">Total: {formatIDR(calculateTotalCost(s.outfit))}</p>
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <button onClick={() => { setCurrentOutfit(s.outfit); setIsVaultOpen(false); setActiveTab('builder'); }} className="px-3.5 py-2 rounded-xl bg-gradient-to-r from-rose-500 to-pink-500 text-white text-xs font-bold shadow-sm">
                            Pakai di Builder ➔
                          </button>
                          <button onClick={() => deleteFromVault(s.id)} className="p-2 rounded-xl border border-rose-200 text-slate-400 hover:text-rose-600 hover:bg-rose-100">
                            🗑️
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                <div className="p-4 bg-slate-50 border-t border-rose-100 text-right">
                  <button onClick={() => setIsVaultOpen(false)} className="px-5 py-2 rounded-xl text-sm font-semibold bg-white border border-slate-200 text-slate-700 hover:bg-slate-100">Tutup</button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-white border-t border-rose-200/80 py-8 px-4 mt-16 text-center">
            <div className="max-w-4xl mx-auto space-y-2">
              <div className="flex items-center justify-center gap-2 text-xl font-serif font-black text-slate-800">
                <span>✨ Très Chic Thrifter 🎀</span>
              </div>
              <p className="font-fancy text-lg text-rose-500 italic">
                "Anyone can be ordinary, but it takes courage, creativity, and a touch of vintage flair to be fancy!"
              </p>
              <p className="text-xs text-slate-400">
                Aplikasi Referensi Outfit Thrift Fancy Nancy dari Atas Kepala Sampai Ujung Kaki
              </p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
